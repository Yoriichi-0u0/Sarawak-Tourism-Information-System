<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-7.5 -7.5 1142 728" width="1142" height="728"><rect x="-7.5" y="-7.5" width="1142" height="728" fill="#ffffff"></rect><g><g></g><g transform="translate(-22,-6) scale(1)"><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="30" y="14" width="1100" height="28" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9" vector-effect="non-scaling-stroke"></rect><rect x="30" y="14" width="1100" height="28" fill="none" stroke="none" pointer-events="all"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="32" y="40">STIS database · access and security model</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="30" y="42" width="1100" height="18" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9" vector-effect="non-scaling-stroke"></rect><rect x="30" y="42" width="1100" height="18" fill="none" stroke="none" pointer-events="all"></rect></g><g style=""><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="32" y="59">Who can reach the stis schema, and where each authorisation rule is enforced (verified against live roles, grants and policies on 25 Nov 2026).</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="30" y="90" width="300" height="120" rx="7.2" ry="7.2" fill="#ffffff" stroke="#888888" stroke-width="1.2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(136, 136, 136), rgb(120, 120, 120));"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="40" y="114">Browser (tourist, staff, administrator, guest)</text><text x="40" y="138">Holds only an HttpOnly session cookie</text><text x="40" y="150">(Path=/api/, SameSite=Lax, Secure) or a guest or</text><text x="40" y="162">share token kept in the URL fragment and sent as</text><text x="40" y="174">an Authorization header.</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="410" y="90" width="360" height="220" rx="13.2" ry="13.2" fill="#eef3fa" stroke="#2b4c7e" stroke-width="1.2" pointer-events="all" style="fill: light-dark(rgb(238, 243, 250), rgb(25, 29, 35)); stroke: light-dark(rgb(43, 76, 126), rgb(150, 178, 221));"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="420" y="114">Vercel Function (sin1): STIS API handler</text><text x="420" y="138">All per-user authorisation happens here:</text><text x="420" y="150">• session lookup by SHA-256 digest; idle and absolute expiry</text><text x="420" y="162">• staff or admin role for records; admin for staff accounts</text><text x="420" y="174">• itinerary: owner_id = session account, or guest-token</text><text x="420" y="186">digest</text><text x="420" y="198">• share-token digest gives a read-only view only</text><text x="420" y="210">• optimistic revision checks (HTTP 409)</text><text x="420" y="222">• transactions with row locks for publish and withdraw</text><text x="420" y="234">• Origin check, JSON-only bodies, size limits, throttling</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="410" y="350" width="360" height="170" rx="10.2" ry="10.2" fill="#fbf5e8" stroke="#8a5a00" stroke-width="1.2" pointer-events="all" style="fill: light-dark(rgb(251, 245, 232), rgb(31, 26, 14)); stroke: light-dark(rgb(138, 90, 0), rgb(195, 153, 76));"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="420" y="374">Database role stis_api (login through the Supavisor pooler)</text><text x="420" y="398">Not superuser · no BYPASSRLS · inherits no roles ·</text><text x="420" y="410">statement_timeout 10s</text><text x="420" y="422">USAGE on schema stis (plus PUBLIC usage of the empty public</text><text x="420" y="434">schema)</text><text x="420" y="446">No readable or writable table outside stis</text><text x="420" y="458">Append-only: no UPDATE or DELETE on tourism_record,</text><text x="420" y="470">record_version, version_destination, record_activity</text><text x="420" y="482">SELECT only on schema_migration</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="410" y="570" width="360" height="140" rx="8.4" ry="8.4" fill="#edf6f1" stroke="#1f5c46" stroke-width="1.2" pointer-events="all" style="fill: light-dark(rgb(237, 246, 241), rgb(23, 30, 26)); stroke: light-dark(rgb(31, 92, 70), rgb(131, 183, 164));"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="420" y="594">Schema stis (12 tables, owner postgres)</text><text x="420" y="618">RLS enabled on all 12 tables, one policy each:</text><text x="420" y="630">stis_api_access FOR ALL TO stis_api USING (true) WITH CHECK</text><text x="420" y="642">(true). RLS therefore admits only stis_api; it does not</text><text x="420" y="654">separate one user's rows from another's. That separation is</text><text x="420" y="666">the API's job.</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="850" y="570" width="290" height="140" rx="8.4" ry="8.4" fill="#ffffff" stroke="#b3261e" stroke-width="1.2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(179, 38, 30), rgb(255, 154, 147));"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="860" y="594">Supabase Data API (PostgREST, GraphQL): roles</text><text x="860" y="606">anon, authenticated, service_role</text><text x="860" y="630">stis is not an exposed schema and none of these</text><text x="860" y="642">roles has USAGE on it, so /rest/v1 and GraphQL</text><text x="860" y="654">cannot reach any stis table. service_role has</text><text x="860" y="666">BYPASSRLS but no grant, so it is refused too.</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="30" y="570" width="300" height="140" rx="8.4" ry="8.4" fill="#f3f4f6" stroke="#5b6472" stroke-width="1.2" pointer-events="all" style="fill: light-dark(rgb(243, 244, 246), rgb(26, 27, 28)); stroke: light-dark(rgb(91, 100, 114), rgb(145, 153, 165));"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="40" y="594">postgres (schema and table owner, BYPASSRLS)</text><text x="40" y="618">Used only for migrations and inspection from the</text><text x="40" y="630">Supabase dashboard or connector; never by the</text><text x="40" y="642">running application.</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="850" y="90" width="290" height="260" rx="15.6" ry="15.6" fill="#ffffff" stroke="#888888" stroke-width="1.2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(136, 136, 136), rgb(120, 120, 120));"></rect></g><g style=""><g fill="#1A1A1A" font-family="Helvetica" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="860" y="114">Review conclusion</text><text x="860" y="138">The USING (true) policies are justified by this</text><text x="860" y="150">architecture: the browser never talks to</text><text x="860" y="162">PostgreSQL, and one server role acts for every</text><text x="860" y="174">user. They are a role gate, not row isolation.</text><text x="860" y="198">Residual risk: a leaked stis_api credential</text><text x="860" y="210">could read accounts (emails, scrypt hashes) and</text><text x="860" y="222">change itineraries, but could not rewrite</text><text x="860" y="234">publication history.</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><path d="M 330 150 L 360 150 Q 370 150 380 149.85 L 399.04 149.56" fill="none" stroke="white" stroke-width="9.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));" visibility="hidden" vector-effect="non-scaling-stroke"></path><path d="M 330 150 L 360 150 Q 370 150 380 149.85 L 399.04 149.56" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path><path d="M 408.43 149.42 L 399.11 154.26 L 398.97 144.86 Z" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187)); stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path></g><g style=""><g fill="#3A3A3A" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"><rect fill="#FFFFFF" stroke="none" x="336" y="144" width="68" height="13" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"></rect><text x="370" y="154">HTTPS /api/v1</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><path d="M 590 310 L 590 339.03" fill="none" stroke="white" stroke-width="9.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));" visibility="hidden" vector-effect="non-scaling-stroke"></path><path d="M 590 310 L 590 339.03" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path><path d="M 590 348.43 L 585.3 339.03 L 594.7 339.03 Z" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187)); stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path></g><g style=""><g fill="#3A3A3A" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"><rect fill="#FFFFFF" stroke="none" x="485" y="324" width="209" height="13" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"></rect><text x="590" y="334">parameterised SQL, one role for every request</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><path d="M 590 520 L 590 559.03" fill="none" stroke="white" stroke-width="9.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));" visibility="hidden" vector-effect="non-scaling-stroke"></path><path d="M 590 520 L 590 559.03" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path><path d="M 590 568.43 L 585.3 559.03 L 594.7 559.03 Z" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187)); stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path></g><g style=""><g fill="#3A3A3A" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"><rect fill="#FFFFFF" stroke="none" x="545" y="539" width="89" height="13" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"></rect><text x="590" y="549">grants + RLS policy</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><path d="M 850 640 L 770 640" fill="none" stroke="white" stroke-width="9.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(179, 38, 30), rgb(255, 154, 147));" visibility="hidden" vector-effect="non-scaling-stroke"></path><path d="M 850 640 L 770 640" fill="none" stroke="#b3261e" stroke-width="1.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(179, 38, 30), rgb(255, 154, 147));"></path><path d="M 775.2 634.8 L 785.6 645.2 M 775.2 645.2 L 785.6 634.8" fill="none" stroke="white" stroke-width="9.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(179, 38, 30), rgb(255, 154, 147));" visibility="hidden" vector-effect="non-scaling-stroke"></path><path d="M 775.2 634.8 L 785.6 645.2 M 775.2 645.2 L 785.6 634.8" fill="none" stroke="#b3261e" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="stroke: light-dark(rgb(179, 38, 30), rgb(255, 154, 147));"></path></g><g style=""><g fill="#B3261E" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(179, 38, 30), rgb(255, 154, 147));"><rect fill="#FFFFFF" stroke="none" x="765" y="634" width="90" height="12" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"></rect><text x="810" y="644">no USAGE: refused</text></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><path d="M 330 640 L 399.03 640" fill="none" stroke="white" stroke-width="9.4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));" visibility="hidden" vector-effect="non-scaling-stroke"></path><path d="M 330 640 L 399.03 640" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" stroke-dasharray="4.2 4.2" pointer-events="stroke" style="stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path><path d="M 408.43 640 L 399.03 644.7 L 399.03 635.3 Z" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187)); stroke: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"></path></g><g style=""><g fill="#3A3A3A" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(58, 58, 58), rgb(187, 187, 187));"><rect fill="#FFFFFF" stroke="none" x="345" y="634" width="49" height="13" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"></rect><text x="370" y="644">migrations</text></g></g></g><g aria-hidden="true"></g><g aria-hidden="true"></g></g></svg>
