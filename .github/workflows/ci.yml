name: CI

on:
  push:
    branches: [codex/full-system, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stis_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stis_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.8.1
          cache: npm
      - run: npm ci
      - name: Tests (PGlite)
        run: npm test
      - name: Server tests on Postgres 17 (postgres.js driver)
        run: npm run test:postgres
        env:
          STIS_TEST_DATABASE_URL: postgres://stis_test@127.0.0.1:5432/postgres
      - run: npm run typecheck
      - run: npm run build:vercel
